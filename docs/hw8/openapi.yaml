openapi: 3.0.3
info:
  title: HW8 Stream Processing HTTP API
  version: 1.0.0
  description: |
    HTTP API для домашнего задания HW8.
    Бизнес-процесс между сервисами реализован через Kafka,
    а HTTP используется для внешних вызовов и чтения состояния.

servers:
  - url: http://arch.homework

paths:
  /auth/register:
    post:
      summary: Создать пользователя
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /billing/{userId}:
    get:
      summary: Получить billing account пользователя
      tags: [Billing]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Billing account найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '404':
          description: Billing account не найден

  /billing/{userId}/deposit:
    post:
      summary: Пополнить баланс пользователя
      tags: [Billing]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200':
          description: Баланс пополнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '400':
          description: Некорректная сумма
        '404':
          description: Billing account не найден

  /billing/{userId}/withdraw:
    post:
      summary: Списать средства вручную
      tags: [Billing]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200':
          description: Средства списаны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '400':
          description: Недостаточно средств или некорректная сумма
        '404':
          description: Billing account не найден

  /orders:
    post:
      summary: Создать заказ
      description: |
        Заказ сохраняется со статусом PENDING.
        После этого Order Service публикует событие order-created в Kafka.
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}:
    get:
      summary: Получить заказ
      tags: [Order]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Заказ найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Заказ не найден

  /notifications/{userId}:
    get:
      summary: Получить уведомления пользователя
      tags: [Notification]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Список уведомлений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - firstName
        - lastName
        - email
        - phone
        - password
      properties:
        username:
          type: string
          example: stream_001
        firstName:
          type: string
          example: Arman
        lastName:
          type: string
          example: Stream
        email:
          type: string
          format: email
          example: stream_001@test.com
        phone:
          type: string
          example: "77770000001"
        password:
          type: string
          example: Password123!

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 20
        username:
          type: string
          example: stream_001
        email:
          type: string
          example: stream_001@test.com

    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          example: 1000

    BillingAccount:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 2
        userId:
          type: integer
          format: int64
          example: 20
        balance:
          type: number
          format: double
          example: 700
        email:
          type: string
          format: email
          example: stream_001@test.com

    CreateOrderRequest:
      type: object
      required:
        - userId
        - price
      properties:
        userId:
          type: integer
          format: int64
          example: 20
        price:
          type: number
          format: double
          example: 300

    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 4
        userId:
          type: integer
          format: int64
          example: 20
        price:
          type: number
          format: double
          example: 300
        status:
          type: string
          enum:
            - PENDING
            - PAID
            - FAILED
          example: PAID

    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 3
        userId:
          type: integer
          format: int64
          example: 20
        orderId:
          type: integer
          format: int64
          example: 4
        email:
          type: string
          format: email
          example: stream_001@test.com
        subject:
          type: string
          example: Письмо счастья
        message:
          type: string
          example: "Заказ успешно оплачен. Сумма: 300"
