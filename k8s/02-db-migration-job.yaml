apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: db-migration
          image: postgres:16

          env:
            - name: PGHOST
              value: postgres-postgresql

            - name: PGPORT
              value: "5432"

            - name: PGDATABASE
              value: usersdb

            - name: PGUSER
              value: appuser

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password

          command:
            - /bin/sh
            - -c
            - |
              echo '{"level":"INFO","service":"db-migration","event":"MIGRATION_START","message":"Database migration started"}'

              if psql -v ON_ERROR_STOP=1 -f /migration/migration.sql; then
                echo '{"level":"INFO","service":"db-migration","event":"MIGRATION_FINISH","message":"Database migration completed"}'
              else
                echo '{"level":"ERROR","service":"db-migration","event":"MIGRATION_FAILED","message":"Database migration failed"}'
                exit 1
              fi

          volumeMounts:
            - name: migration
              mountPath: /migration

      volumes:
        - name: migration
          configMap:
            name: db-migration

  backoffLimit: 3