apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: armandockerrr/billing-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres-postgresql.default.svc.cluster.local:5432/usersdb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.default.svc.cluster.local:9092
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: default
spec:
  selector:
    app: billing-service
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: armandockerrr/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres-postgresql.default.svc.cluster.local:5432/usersdb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.default.svc.cluster.local:9092

            - name: BILLING_URL
              value: http://billing-service.default.svc.cluster.local:8001

            - name: WAREHOUSE_URL
              value: http://warehouse-service.default.svc.cluster.local:8004

            - name: DELIVERY_URL
              value: http://delivery-service.default.svc.cluster.local:8005

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
spec:
  selector:
    app: order-service
  ports:
    - port: 8002
      targetPort: 8002
