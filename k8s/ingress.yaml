apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: msa-hw2-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: arch.homework
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: msa-hw2-service
                port:
                  number: 80

          - path: /billing
            pathType: Prefix
            backend:
              service:
                name: billing-service
                port:
                  number: 8001

          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8002

          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8003

          - path: /warehouse
            pathType: Prefix
            backend:
              service:
                name: warehouse-service
                port:
                  number: 8004

          - path: /delivery
            pathType: Prefix
            backend:
              service:
                name: delivery-service
                port:
                  number: 8005