apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
spec:
  selector:
    matchLabels:
      app: fluent-bit

  template:
    metadata:
      labels:
        app: fluent-bit

    spec:
      serviceAccountName: fluent-bit

      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.2

          resources:
            requests:
              cpu: 20m
              memory: 30Mi
            limits:
              cpu: 100m
              memory: 80Mi

          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true

            - name: varlib
              mountPath: /var/lib/fluent-bit

            - name: config
              mountPath: /fluent-bit/etc/
              readOnly: true

      volumes:
        - name: varlog
          hostPath:
            path: /var/log

        - name: varlib
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate

        - name: config
          configMap:
            name: fluent-bit-config