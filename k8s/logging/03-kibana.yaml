apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
spec:
  replicas: 1

  selector:
    matchLabels:
      app: kibana

  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.0

          ports:
            - containerPort: 5601
              name: http

          env:
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch:9200"]'

            - name: SERVER_HOST
              value: "0.0.0.0"

            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"

          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 650Mi

          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
spec:
  type: NodePort

  selector:
    app: kibana

  ports:
    - name: http
      port: 5601
      targetPort: 5601
      nodePort: 30561