spring.application.name=msa-hw6
server.port=8000

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usersdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}

spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,prometheus,metrics

management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.structured.format.console=logstash

jwt.secret=change-me-to-a-long-secret-key-for-hw7-1234567890
jwt.expiration-ms=3600000

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer